name: Desktop build and acceptance
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        default: windows
        options: [windows, all]
  push:
    paths: ['desktop/**', 'server/**', 'core/**', 'storage/**', 'tools/*desktop*', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'server/**', 'core/**', 'storage/**', 'tools/*desktop*', '.github/workflows/desktop.yml']
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && '[{"os":"macos-15","arch":"arm64","binary":"douyin-sidecar"},{"os":"macos-15-intel","arch":"x64","binary":"douyin-sidecar"},{"os":"windows-2022","arch":"x64","binary":"douyin-sidecar.exe"}]' || '[{"os":"windows-2022","arch":"x64","binary":"douyin-sidecar.exe"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -e ".[dev]" -r desktop/requirements-build.txt -c desktop/constraints.txt
      - name: Check Windows worker lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import asyncio, json, os, subprocess, sys, tempfile
          from pathlib import Path
          from tests.test_watermark import make_video
          from core.watermark.service import process_file
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              source = make_video(root / 'source.mp4')
              for monitored in ('0', '1'):
                  work = root / monitored
                  work.mkdir()
                  response = work / 'response.json'
                  request = work / 'request.json'
                  request.write_text(json.dumps({'source':str(source),'workspace':str(work),'response':str(response),'config':{'visible':False}}))
                  with (work / 'worker.log').open('w') as output:
                      proc = subprocess.Popen([sys.executable,'-m','core.watermark.worker',str(request)],stdin=subprocess.PIPE,stdout=output,stderr=output,env={**os.environ,'DOUYIN_WORKER_PARENT_PIPE':monitored,'DOUYIN_WATERMARK_PROGRESS':'1'})
                      try:
                          proc.wait(timeout=30)
                          print('parent_watch',monitored,'exit',proc.returncode,flush=True)
                      except subprocess.TimeoutExpired:
                          print('parent_watch',monitored,'timeout','response_exists',response.exists(),flush=True)
                          proc.kill()
                          proc.wait()
                      finally:
                          proc.stdin.close()
                  print((work / 'worker.log').read_text(encoding='utf-8'))
              source = make_video(root / 'async.mp4')
              result = asyncio.run(process_file(source,{'visible':False,'timeout_seconds':30},progress=lambda path,event:print(event,flush=True)))
              print('::notice::async_worker '+str(result),flush=True)
          '@ | python -
      - name: Backend tests
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          log = Path('backend-tests.log')
          with log.open('w', encoding='utf-8') as output:
              result = subprocess.run([sys.executable,'-m','pytest','tests/','-x','-vv','-o','faulthandler_timeout=60'],stdout=output,stderr=subprocess.STDOUT)
          text = log.read_text(encoding='utf-8')
          print(text)
          if result.returncode:
              detail = text[-12000:]
              for offset in range(0, len(detail), 3000):
                  chunk = detail[offset:offset+3000]
                  print('::error title=Backend tests::'+chunk.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          sys.exit(result.returncode)
      - run: python -m ruff check .
      - run: python -m compileall -q core config cli server tools
      - run: npm ci
        working-directory: desktop
      - run: npx install-electron --no
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python -c "import os,sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('DOUYIN_PYTHON=' + sys.executable + '\n')"
      - run: npm run test:e2e
        working-directory: desktop
      - run: python -m tools.build_desktop
      - run: python -m tools.check_desktop dist/douyin-sidecar/${{ matrix.binary }} --model-dir dist/ocr-v4
      - run: npm run package -- --${{ matrix.arch }}
        working-directory: desktop
      - run: python -c "from pathlib import Path; import subprocess,sys; p=next(Path('desktop/release').rglob('${{ matrix.binary }}')); subprocess.run([sys.executable,'-m','tools.check_desktop',str(p),'--model-dir',str(p.parent.parent/'ocr-v4')],check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
            desktop/test-results/**
