name: Media cleanup
on: [workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[server,dev]"
      - run: python -m tools.watermark setup
      - run: python -m compileall -q core config cli server tools
      - run: ruff check .
      - run: python -m pytest tests/
